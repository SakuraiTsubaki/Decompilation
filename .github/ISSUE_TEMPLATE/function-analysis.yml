name: Function analysis
description: Record or improve analysis for a function or symbol.
title: "[Function] "
body:
  - type: input
    id: target
    attributes:
      label: Function / symbol
      description: Provide the current symbol, address, signature, or temporary identifier.
      placeholder: sub_00123456
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      options:
        - Confirmed
        - Probable
        - Hypothesis
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: List addresses, callers/callees, constants, strings, data references, public references, or comparison results.
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Findings
      description: Describe the proposed behavior, role, parameters, return value, side effects, or naming rationale.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Explain how the finding was checked or what would still be needed to verify it.
  - type: textarea
    id: notes
    attributes:
      label: Notes / follow-up
      description: Record unresolved questions, related symbols, or next steps.
