name: Decompilation task
description: Track source reconstruction or a defined decompilation work item.
title: "[Decompilation] "
body:
  - type: input
    id: target
    attributes:
      label: Target
      description: Identify the function, module, subsystem, or data region to reconstruct.
      placeholder: module / symbol / address range
    validations:
      required: true
  - type: textarea
    id: current_state
    attributes:
      label: Current state
      description: Describe what is already known, including existing assembly, pseudocode, symbols, or analysis.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Reconstruction goal
      description: Define the expected source, data, headers, or supporting work that should be produced.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List prerequisite analysis, symbols, formats, tools, or related tasks.
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Explain how the reconstructed result should be checked.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Completion checklist
      options:
        - label: Evidence and provenance are documented.
        - label: Source/data are placed in the correct repository area.
        - label: Unresolved behavior remains clearly marked.
        - label: Verification results are recorded.
