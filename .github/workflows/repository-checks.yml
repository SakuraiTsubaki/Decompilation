name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify core structure
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "src/code"
            "src/asm"
            "src/include"
            "src/data"
            "assets/graphics"
            "assets/audio"
            "assets/text"
            "assets/maps"
            "assets/metadata"
            "analysis/binaries"
            "analysis/functions"
            "analysis/symbols"
            "analysis/structures"
            "analysis/formats"
            "analysis/comparisons"
            "tools/extraction"
            "tools/conversion"
            "tools/analysis"
            "tools/build"
            "tools/verification"
            "config/symbols"
            "config/mappings"
            "config/build"
            "docs/architecture"
            "docs/decompilation"
            "docs/formats"
            "docs/progress"
            "docs/references"
            "tests/unit"
            "tests/regression"
            "tests/comparison"
            "scripts/setup"
            "scripts/build"
            "scripts/verify"
          )

          failed=0
          for path in "${required_paths[@]}"; do
            if [[ ! -d "$path" ]]; then
              echo "Missing required directory: $path"
              failed=1
            fi
          done

          exit "$failed"

      - name: Reject tracked ROM and installable game packages
        shell: bash
        run: |
          set -euo pipefail

          banned='\.(gb|gbc|gba|nds|3ds|cia|cci|xci|nsp|rom)$'
          matches="$(git ls-files | grep -Ei "$banned" || true)"

          if [[ -n "$matches" ]]; then
            echo "Forbidden binary/package files are tracked:"
            echo "$matches"
            exit 1
          fi

      - name: Check Python syntax
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(find tools scripts tests -type f -name '*.py' -print0 2>/dev/null || true)
          if (( ${#files[@]} > 0 )); then
            python -m py_compile "${files[@]}"
          else
            echo "No Python files to check."
          fi

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(find tools scripts tests -type f -name '*.sh' -print0 2>/dev/null || true)
          if (( ${#files[@]} > 0 )); then
            for file in "${files[@]}"; do
              bash -n "$file"
            done
          else
            echo "No shell scripts to check."
          fi

      - name: Check trailing whitespace
        shell: bash
        run: |
          set -euo pipefail

          if git grep -nI -E '[[:blank:]]+$' -- ':!*.patch' ':!*.diff'; then
            echo "Trailing whitespace found."
            exit 1
          fi

          echo "No trailing whitespace found."
